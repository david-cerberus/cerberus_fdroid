AutoName: Cerberus
Summary: Secure and private zero-knowledge password manager
Description: |-
  Cerberus is a secure, offline-first, and zero-knowledge password manager designed to protect credentials, secure notes, attachments, and two-factor authentication codes (TOTP / 2FA).

  Key Features:
  * Military-grade local encryption powered by SQLCipher (AES-256) with PBKDF2 key derivation (600,000 iterations).
  * Biometric authentication (fingerprint and face unlock).
  * Built-in secure password generator and comprehensive password health analysis.
  * Native Android Autofill Service integration.
  * Integrated 2FA authenticator (TOTP) with QR code scanner support.
  * Local backup, import, and export supporting KeePass (.kdbx) and encrypted CSV.
  * Optional cloud backup and sync via Google Drive with end-to-end encryption.

